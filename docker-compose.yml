services:
  postgres:
    image: postgres:16-alpine
    container_name: url-shortener-postgres
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis-master:
    image: redis:7-alpine
    container_name: url-shortener-redis-master
    environment:
      - REDISCLI_AUTH=${REDIS_PASSWORD}
    command: redis-server --requirepass ${REDIS_PASSWORD}
    healthcheck:
      test: ["CMD-SHELL", "redis-cli ping | grep PONG"]
      interval: 5s
      timeout: 3s
      retries: 5

  redis-replica:
    image: redis:7-alpine
    container_name: url-shortener-redis-replica
    command: redis-server --replicaof redis-master 6379 --requirepass ${REDIS_PASSWORD} --masterauth ${REDIS_PASSWORD}
    depends_on:
      redis-master:
        condition: service_healthy

  redis-sentinel:
    image: redis:7-alpine
    container_name: url-shortener-redis-sentinel
    depends_on:
      redis-master:
        condition: service_healthy
    volumes:
      - ./sentinel.conf:/etc/redis/sentinel.conf
    command: redis-server /etc/redis/sentinel.conf --sentinel

  app:
    build:
      context: ./url-shortener
      dockerfile: Dockerfile
    container_name: url-shortener-app
    depends_on:
      postgres:
        condition: service_healthy
      redis-master:
        condition: service_healthy
    env_file:
      - .env
    ports:
      - "8080:8080"

volumes:
  postgres_data:
