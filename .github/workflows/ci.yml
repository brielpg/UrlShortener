name: Continuous Integration (CI)

on:
  push:
    branches: ["main"]
    paths-ignore:
      - '**.md'
      - '**.txt'
      - '**.yml'
      - '**.example'
      - '**.gitignore'
  pull_request:
    branches: ["main"]
    paths-ignore:
      - '**.md'
      - '**.txt'
      - '**.yml'
      - '**.example'
      - '**.gitignore'

jobs:
  tests:
    name: Build and Test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Setup JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: maven

      - name: Build with Maven
        run: mvn clean verify